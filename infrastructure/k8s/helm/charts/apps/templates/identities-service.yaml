apiVersion: v1
kind: Service
metadata:
  name: identities-service
  labels:
    app: identities
    chart: {{ include "apps.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.identities.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: identities
    release: {{ .Release.Name }}
