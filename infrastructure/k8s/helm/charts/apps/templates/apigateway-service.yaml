apiVersion: v1
kind: Service
metadata:
  name: {{ include "apps.fullname" . }}-apigateway
  labels:
    app: apigateway
    chart: {{ include "apps.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.apigateway.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: apigateway
    release: {{ .Release.Name }}
