apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "apps.fullname" . }}-identities
  labels:
    app: identities
    chart: {{ include "apps.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: identities
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: identities
        release: {{ .Release.Name }}
    spec:
      containers:
        - name: identities
          image: "{{ .Values.identities.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.identities.service.port }}
              name: http
              protocol: TCP
          env:
            {{- include "apps.commonEnv" (dict "root" . "consulAddress" .Values.identities.consulAddress) | nindent 12 }}
          {{- include "apps.probes" .Values.identities | nindent 10 }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
      {{- end }}
