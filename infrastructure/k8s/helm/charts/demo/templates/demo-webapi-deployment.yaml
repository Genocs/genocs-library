{{- if .Values.demoWebapi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.demoWebapi.name }}
  labels:
    app: {{ .Values.demoWebapi.name }}
    chart: {{ include "demo.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.demoWebapi.name }}
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Values.demoWebapi.name }}
        release: {{ .Release.Name }}
    spec:
      containers:
        - name: {{ .Values.demoWebapi.name }}
          image: "{{ .Values.demoWebapi.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.demoWebapi.containerPort }}
              name: http
              protocol: TCP
          env:
            {{- include "demo.commonEnv" . | nindent 12 }}
            {{- include "demo.webapiEnv" .Values.demoWebapi | nindent 12 }}
          {{- include "demo.probes" .Values.demoWebapi | nindent 10 }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
      {{- end }}
{{- end }}
